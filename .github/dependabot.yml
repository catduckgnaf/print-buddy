# Dependabot — keep GitHub Actions current.
#
# Added after actions/upload-artifact@v4 survived in ci.yml long past the
# Node 20 runner removal (2026-09-23) while every other workflow had been
# bumped by hand: nothing was watching the workflow files. Updates are
# grouped so action bumps arrive as one PR, not one PR per action.
# Dependabot updates SHA-pinned actions in place and keeps the trailing
# version comment (e.g. `# v7.0.2`) in step, so the docker workflows'
# pinning style is preserved.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
