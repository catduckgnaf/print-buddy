name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Offline tests (no printer, no slicer, no network)
        run: python -m pytest -q tests

  real-slicer:
    # Slices fixtures and the Discord flow corpus with the Flathub Orca the home box runs, using the home templates.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache Flathub Orca
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          # Bump v1 to pick up a newer Flathub Orca; until then CI keeps slicing with the same build.
          key: flatpak-orca-${{ runner.os }}-v1
      - name: Install pinned OrcaSlicer from Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub com.orcaslicer.OrcaSlicer
          flatpak info --user com.orcaslicer.OrcaSlicer | tee "$RUNNER_TEMP/orca-info.txt"
          commit=$(awk '/Commit:/ {print $2}' "$RUNNER_TEMP/orca-info.txt")
          test -n "$commit"
          flatpak update --user -y --noninteractive --commit="$commit" com.orcaslicer.OrcaSlicer
          echo "ORCA_FLATPAK_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Pinned Orca commit: $commit"
      - name: Real slicer tests
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/slicer
      - name: Discord flow corpus with real Orca
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/corpus

  spoolman:
    # spool_sync against a real, throwaway Spoolman.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install pinned Spoolman server natively
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spoolman-v0.27.0.zip"
          curl -fL --retry 3 https://codeload.github.com/Donkie/Spoolman/zip/refs/tags/v0.27.0 -o "$archive"
          echo '9ceead75734683b8d5f92cb6f7b9cc0d83acaf2418f72d48736d7f995d583f42  '"$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/spoolman-src"
          unzip -q "$archive" -d "$RUNNER_TEMP/spoolman-src"
          cd "$RUNNER_TEMP/spoolman-src/Spoolman-0.27.0"
          python -m venv "$RUNNER_TEMP/spoolman-venv"
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install -r requirements.txt
          echo "SPOOLMAN_APP_DIR=$PWD" >> "$GITHUB_ENV"
          echo "SPOOLMAN_PYTHON=$RUNNER_TEMP/spoolman-venv/bin/python" >> "$GITHUB_ENV"
      - name: Start isolated Spoolman server
        run: |
          mkdir -p "$RUNNER_TEMP/spoolman-data"
          cd "$SPOOLMAN_APP_DIR"
          SPOOLMAN_DIR_DATA="$RUNNER_TEMP/spoolman-data" SPOOLMAN_PORT=7912 SPOOLMAN_HOST=127.0.0.1 \
            "$SPOOLMAN_PYTHON" -m uvicorn spoolman.main:app --host 127.0.0.1 --port 7912 \
            > "$RUNNER_TEMP/spoolman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spoolman.pid"
      - name: Wait for Spoolman
        run: |
          for i in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:7912/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/spoolman.log"
          echo "Spoolman did not come up"; exit 1
      - name: Spoolman tests
        env:
          PRINT_BUDDY_SPOOLMAN_TEST_URL: http://localhost:7912
        run: python -m pytest -v -rs tests/services
