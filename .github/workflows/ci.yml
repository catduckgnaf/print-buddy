name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Offline tests (no printer, no slicer, no network)
        run: python -m pytest -q tests

  real-slicer:
    # Slices fixtures with the Flathub Orca the home box runs, using the home templates.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache Flathub Orca
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          # Bump v1 to pick up a newer Flathub Orca; until then CI keeps slicing with the same build.
          key: flatpak-orca-${{ runner.os }}-v1
      - name: Install OrcaSlicer from Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub com.orcaslicer.OrcaSlicer
          flatpak info --user com.orcaslicer.OrcaSlicer
      - name: Real slicer tests
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/slicer

  spoolman:
    # spool_sync against a real, throwaway Spoolman.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      spoolman:
        image: ghcr.io/donkie/spoolman:0.27.0
        ports:
          - 7912:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Wait for Spoolman
        run: |
          for i in $(seq 60); do curl -fs http://localhost:7912/api/v1/health && exit 0; sleep 2; done
          echo "Spoolman did not come up"; exit 1
      - name: Spoolman tests
        env:
          PRINT_BUDDY_SPOOLMAN_TEST_URL: http://localhost:7912
        run: python -m pytest -v -rs tests/services
