name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Offline tests (no printer, no slicer, no network)
        run: python -m pytest -q tests

  standalone-no-hermes:
    # #73: the standalone bot installs from requirements.txt alone, loads every handler and imports no Hermes module.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Clean venv with runtime requirements only
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install -r requirements.txt
      - name: Standalone bot setup check
        env:
          PRINT_BUDDY__BOT__MODE: standalone
          PRINT_BUDDY__DISCORD__CHAT_ID: "100000000000000001"
          PRINT_BUDDY__DISCORD__ALLOWED_USER_IDS: "200000000000000002"
          DISCORD_BOT_TOKEN: not-a-real-token
        run: |
          export PRINT_BUDDY__PATHS__HERMES_HOME="$RUNNER_TEMP/print-buddy"
          "$RUNNER_TEMP/clean/bin/python" -m print_buddy.bot check

  real-slicer:
    # Full corpus and slicer fixtures stay on the production-default OrcaSlicer 2.4.2 track.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install Flathub OrcaSlicer 2.4.2 and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub com.orcaslicer.OrcaSlicer
          flatpak info --user com.orcaslicer.OrcaSlicer
      - name: Run real-slicer tests (2.4.2)
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/slicer
      - name: Discord flow corpus with real Orca
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/corpus

  real-slicer-alpha:
    # Alpha validation is intentionally limited; full Discord corpus remains on the 2.4.2 job.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 30
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      PRINT_BUDDY_REAL_SLICER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache OrcaSlicer 2.5.0 alpha bundle and runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/orcaslicer-v2.5.0-alpha.flatpak
            ~/.local/share/flatpak
          key: orcaslicer-flatpak-v2.5.0-alpha-${{ runner.os }}-x86_64
      - name: Download and verify upstream OrcaSlicer v2.5.0-alpha bundle
        run: |
          set -euo pipefail
          bundle="$HOME/.cache/orcaslicer-v2.5.0-alpha.flatpak"
          mkdir -p "$(dirname "$bundle")"
          if [ -f "$bundle" ] && ! echo '2caa907e75ca1cd499568d7940d1fe787b795b3deff1d5dcf4cda31f1a4b6d32  '"$bundle" | sha256sum --check --status; then
            rm "$bundle"
          fi
          if [ ! -f "$bundle" ]; then
            curl --fail --location --retry 3 --output "$bundle" \
              https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0-alpha/OrcaSlicer-Linux-flatpak_V2.5.0-alpha_x86_64.flatpak
          fi
          echo '2caa907e75ca1cd499568d7940d1fe787b795b3deff1d5dcf4cda31f1a4b6d32  '"$bundle" | sha256sum --check
          echo "ORCA_ALPHA_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Install OrcaSlicer app bundle and runtime
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//50
          # The restored cache may already contain the app; do not reinstall its bundle.
          if ! flatpak info --user --show-ref "$ORCA_FLATPAK_APP_ID" >/dev/null 2>&1; then
            flatpak install --user --bundle -y --noninteractive "$ORCA_ALPHA_BUNDLE"
          fi
          flatpak info --user --show-ref "$ORCA_FLATPAK_APP_ID"
          flatpak info --user --show-commit "$ORCA_FLATPAK_APP_ID"
      - name: Run slicer tests (2.5.0 alpha)
        run: xvfb-run -a python -m pytest -v -s tests/slicer
      - name: Run representative Discord fixtures (2.5.0 alpha only)
        run: >-
          xvfb-run -a python -m pytest -v -s
          tests/corpus/test_corpus.py::test_discord_flow[single-part]
          tests/corpus/test_corpus.py::test_discord_flow[plates-multicolor]

  spoolman:
    # spool_sync against a real, throwaway Spoolman.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install pinned Spoolman server natively
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spoolman.zip"
          curl -fL --retry 3 https://github.com/Donkie/Spoolman/releases/download/v0.27.0/spoolman.zip -o "$archive"
          echo 'bcc961af4c20d7ad7f1740f5609cd3efd94c4556baafaeba5036122dd7e46704  '"$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/spoolman-src"
          unzip -q "$archive" -d "$RUNNER_TEMP/spoolman-src"
          cd "$RUNNER_TEMP/spoolman-src"
          python -m venv "$RUNNER_TEMP/spoolman-venv"
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install uvicorn~=0.34
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install -r requirements.txt
          echo "SPOOLMAN_APP_DIR=$PWD" >> "$GITHUB_ENV"
          echo "SPOOLMAN_PYTHON=$RUNNER_TEMP/spoolman-venv/bin/python" >> "$GITHUB_ENV"
      - name: Start isolated Spoolman server
        run: |
          mkdir -p "$RUNNER_TEMP/spoolman-data"
          cd "$SPOOLMAN_APP_DIR"
          PATH="$RUNNER_TEMP/spoolman-venv/bin:$PATH" SPOOLMAN_DIR_DATA="$RUNNER_TEMP/spoolman-data" SPOOLMAN_PORT=7912 SPOOLMAN_HOST=127.0.0.1 \
            "$SPOOLMAN_PYTHON" -m uvicorn spoolman.main:app --host 127.0.0.1 --port 7912 \
            > "$RUNNER_TEMP/spoolman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spoolman.pid"
      - name: Wait for Spoolman
        run: |
          for i in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:7912/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/spoolman.log"
          echo "Spoolman did not come up"; exit 1
      - name: Spoolman tests
        env:
          PRINT_BUDDY_SPOOLMAN_TEST_URL: http://localhost:7912
        run: python -m pytest -v -rs tests/services
