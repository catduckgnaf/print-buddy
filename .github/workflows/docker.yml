name: Docker

# Builds and tests the release image on every architecture for every push and pull request.
# Images are published to GHCR only from a pushed version tag (2.1.0, 2.2.0-rc.1, or v-prefixed),
# and only after the tests below passed for that commit.
on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  config:
    # Compose files, Unraid template and scripts, without building anything.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7
      - name: Validate every supported Compose combination
        run: |
          set -euo pipefail
          cp .env.example .env
          for files in \
              "docker-compose.yml" \
              "docker-compose.yml docker-compose.spoolman.yml" \
              "docker-compose.yml docker-compose.build.yml" \
              "docker-compose.yml docker-compose.spoolman.yml docker-compose.build.yml" \
              "docker-compose.yml docker-compose.spoolman.yml tests/docker/compose.ci.yml"; do
            args=(); for f in $files; do args+=(-f "$f"); done
            echo "docker compose ${args[*]} config"
            docker compose "${args[@]}" config --quiet
          done
          # COMPOSE_FILE in .env is how users enable the bundled Spoolman.
          sed -i 's/^# COMPOSE_FILE=/COMPOSE_FILE=/' .env
          docker compose config --services | sort | tr '\n' ' ' | grep -qx 'print-buddy spoolman '
      - name: Lint shell scripts
        run: shellcheck -x docker/entrypoint.sh docker/install-orcaslicer.sh tests/docker/*.sh tests/docker/flatpak
      - name: Validate the Unraid template
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('docker/unraid/print-buddy.xml')"

  image:
    # Native runners per architecture: the image is built, inspected, and tested as users run it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Read the OrcaSlicer pin
        id: orca
        run: |
          . docker/orcaslicer.lock
          channel=$ORCA_DEFAULT_CHANNEL
          prefix=$(echo "ORCA_${channel}" | tr '[:lower:]' '[:upper:]')
          eval "version=\${${prefix}_VERSION}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: print-buddy:ci
          build-args: |
            ORCA_CHANNEL=${{ steps.orca.outputs.channel }}
            ORCA_VERSION=${{ steps.orca.outputs.version }}
            PRINT_BUDDY_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Image metadata and contents
        run: tests/docker/check_image.sh print-buddy:ci ${{ matrix.arch }}
      - name: Real-slicer tests with the bundled OrcaSlicer
        run: |
          docker run --rm --user 0 -v "$PWD:/src" -w /src -e PRINT_BUDDY_REAL_SLICER=1 print-buddy:ci \
            bash -c 'pip install -q -r requirements-test.txt && python3 -m pytest -v tests/slicer'
      - name: Discord flow corpus with the bundled OrcaSlicer
        # tests/docker/flatpak maps the corpus's pinned Flathub command onto the image's OrcaSlicer.
        run: |
          docker run --rm --user 0 -v "$PWD:/src" -w /src -e PRINT_BUDDY_REAL_SLICER=1 print-buddy:ci \
            bash -c 'pip install -q -r requirements-test.txt && PATH=/src/tests/docker:$PATH python3 -m pytest -v tests/corpus'
      - name: Compose stack, external printer services and external Spoolman
        run: tests/docker/compose_smoke.sh external
      - name: Compose stack, bundled Spoolman persisted across recreation
        run: tests/docker/compose_smoke.sh bundled

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [config, image]
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the OrcaSlicer pin and the release version
        id: pin
        run: |
          . docker/orcaslicer.lock
          channel=$ORCA_DEFAULT_CHANNEL
          prefix=$(echo "ORCA_${channel}" | tr '[:lower:]' '[:upper:]')
          eval "version=\${${prefix}_VERSION}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "orca=$version" >> "$GITHUB_OUTPUT"
          release=${GITHUB_REF_NAME#v}
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          package=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("print_buddy/__init__.py").read()).group(1))')
          if [ "$package" != "${release%%-*}" ]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match print_buddy.__version__ $package"
          fi
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.pin.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ !contains(steps.pin.outputs.release, '-') }}
            type=raw,value=next,enable=${{ contains(steps.pin.outputs.release, '-') }}
          labels: |
            org.opencontainers.image.title=Print Buddy
            io.print-buddy.orcaslicer.channel=${{ steps.pin.outputs.channel }}
            io.print-buddy.orcaslicer.version=${{ steps.pin.outputs.orca }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "${{ steps.pin.outputs.image }}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.pin.outputs.image }}:${{ steps.meta.outputs.version }} already exists; version tags are immutable"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push (amd64, arm64) with provenance and SBOM
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORCA_CHANNEL=${{ steps.pin.outputs.channel }}
            ORCA_VERSION=${{ steps.pin.outputs.orca }}
            PRINT_BUDDY_VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          # Layers come from the tested native builds above.
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
      - name: Verify the published manifest
        run: |
          set -euo pipefail
          ref="${{ steps.pin.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{ range .Manifest.Manifests }}{{ .Platform.OS }}/{{ .Platform.Architecture }} {{ end }}')
          for platform in linux/amd64 linux/arm64; do
            grep -q "$platform" <<<"$platforms" || { echo "missing $platform"; exit 1; }
          done
          docker buildx imagetools inspect "$ref" --format '{{ json .Provenance }}' | grep -q '"SLSA"'
          docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' | grep -q '"SPDX"'
