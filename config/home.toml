# Print Buddy settings: catduck's home setup. Tests run against this exact file.
#
# Change hardware values here, not in code. For anything private or machine specific
# (addresses, tokens, paths on the home box), create config/local.toml. It is gitignored
# and its values override this file key by key. PRINT_BUDDY_CONFIG=/path/to/file.toml
# overrides with that file instead of config/local.toml.

[printer]
name = "Flashforge AD5X"
firmware = "ZMod Klipper"
# Usable print area, matching printable_area in templates/orca/machine.json.
# The physical sheet is 235 mm; Orca and the steppers allow 220.
bed_mm = [220.0, 220.0]
max_print_height_mm = 220.0
# Orca templates are tuned for this nozzle. Slicing refuses any other size.
nozzle_diameter_mm = 0.4
# Filament slots in the IFS. 1 for a single extruder printer.
ifs_slots = 4

[layout]
# Distance from the bed edge for a lone copy and for multi copy plates.
single_copy_edge_mm = 1.0
multi_copy_edge_mm = 3.0
# Gaps when several source plates are merged onto one bed.
merge_edge_margin_mm = 8.0
merge_spacing_mm = 10.0
# Merged plates longer than this are kept separate.
max_merged_hours = 12

[prime_tower]
size_mm = 45.0
# Clearance between the tower and any part.
part_clearance_mm = 8.0
# Closest the tower may sit to the bed edge.
edge_mm = 10.0
# Extra room reserved for the tower when merging plates.
merge_slack_mm = 5.0

[orca]
# Folder holding machine.json, process.json and filament.json. Relative to the repository root.
templates = "print_buddy/templates/orca"
# How to start the Orca CLI. The home box and the CI slicer job both use the Flathub build.
command = ["flatpak", "run", "com.orcaslicer.OrcaSlicer"]

[bambu]
# Fallback slicer when Orca fails. Network is cut so it never phones home.
command = ["flatpak", "run", "--unshare=network", "--command=bambu-studio", "com.bambulab.BambuStudio"]

[paths]
# Hermes profile the bot runs in. State files live in <hermes_home>/state.
hermes_home = "~/.hermes/profiles/3dprinting"
archive = "~/3d-prints"
records_vault = "~/Documents/3D Printing Records"
cache = "~/.hermes/cache"
hermes_bin = "~/.local/bin/hermes"
ffmpeg = "ffmpeg"

[services]
# Addresses are machine specific: set them in config/local.toml. Empty means not configured.
moonraker_url = ""
# Derived from moonraker_url when empty.
moonraker_ws_url = ""
camera_snapshot_url = ""
spoolman_url = ""
openviking_url = ""
vision_chat_url = ""
# Flashforge stock API port for IFS presence. Serial and check code stay in the profile .env.
stock_api_port = 8898

[discord]
# Channel and approver IDs go in config/local.toml.
chat_id = ""
approval_user_id = ""
upload_max_bytes = 9500000
post_print_quiet_s = 7200
daily_reset_hour = 4
timezone = "America/New_York"

[listener]
tick_s = 600
ifs_presence_poll_s = 15
spool_nag_s = 600
start_claim_ttl_s = 1800

[vision]
model = "gemini-latest"

[timelapse]
# Remote archive over ssh. Empty host disables the copy.
archive_host = ""
archive_dir = ""
ssh_key = ""
render_wait_s = 900
render_poll_s = 10
max_bytes = 209715200
local_retention_days = 1

[maintenance]
quick_hours = 25
full_hours = 75
full_days = 30

[cold_pull]
# Profile name = [hot C, cold C]
pla_trial = [220, 90]
petg = [245, 100]
