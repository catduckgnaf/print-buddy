# More than one printer (#257 Stage 2): a config file may declare a roster
# instead of the single [printer] shape below — `printers:` here, [[printers]]
# in TOML — one entry per printer with its own connection keys and chat_id.
# The list is file-only; one entry value can be overridden with
# PRINT_BUDDY__PRINTERS__<ID>__<KEY>. See docs/SETTINGS.md, "Printers list".
printer:
  model: flashforge.ad5x
nozzle_temp_offsets:
  brass: 0.0
  hardened_steel: 0.0
  stainless_steel: 0.0
  ruby: 0.0
  tungsten_carbide: 0.0
  diamond: 0.0
material_temps:
  PLA: {nozzle: 210, bed: 60}
  PETG: {nozzle: 240, bed: 85}
  ABS: {nozzle: 245, bed: 100}
  ASA: {nozzle: 260, bed: 105}
  TPU: {nozzle: 230, bed: 50}
  PA: {nozzle: 260, bed: 90}
  PC: {nozzle: 275, bed: 110}
layout:
  max_merged_hours: 12
orca:
  command:
  - flatpak
  - run
  - com.orcaslicer.OrcaSlicer
slicer:
  # Optional user-installed Flash Studio executable; empty keeps the normal Orca/Bambu behavior.
  flash_studio_path: ''
# Stock Flashforge LAN. Empty host means the printer stays offline. The serial and
# check code are never written here; they stay in AD5X_SERIAL and AD5X_CHECK_CODE.
flashforge_stock:
  host: ''
bambu:
  command:
  - flatpak
  - run
  - --unshare=network
  - --command=bambu-studio
  - com.bambulab.BambuStudio
  # Read-only LAN telemetry (#187): the printer's LAN address and serial number.
  # Both empty = no LAN connection (offline behaviour). The access code is a secret:
  # it lives only in the environment variable lan_access_code_env names, never here.
  lan_host: ''
  lan_serial: ''
  lan_access_code_env: BAMBU_LAN_PASSWORD
  # LAN print start: seconds to poll the printer for it to report the submitted file before
  # the start is left as uncertain (#271). An A1 can take over a minute to unpack a large package.
  start_confirm_s: 90
paths:
  hermes_home: ~/.hermes/profiles/3dprinting
  archive: ~/3d-prints
  records_vault: ~/Documents/3D Printing Records
  cache: ~/.hermes/cache
  hermes_bin: ~/.local/bin/hermes
  ffmpeg: ffmpeg
  hermes_agent: ~/.hermes/hermes-agent
  hermes_restart_helper: ~/.hermes/skills/autonomous-ai-agents/hermes-safe-restart/scripts/restart_hermes.py
services:
  moonraker_url: ''
  moonraker_ws_url: ''
  # Which camera still images come from (#294): auto follows the printer
  # vendor's rule; or pin moonraker, bambu, go2rtc, or none.
  camera_source: auto
  camera_snapshot_url: ''
  spoolman_url: ''
  openviking_url: ''
  vision_chat_url: ''
  stock_api_port: 8898
discord:
  chat_id: ''
  approval_user_id: ''
  upload_max_bytes: 9500000
  post_print_quiet_s: 7200
  daily_reset_hour: 4
  timezone: America/New_York
  bot_name: Print Buddy
  question_timeout_s: 1800
  safety_confirm_timeout_s: 600
  upload_wait_s: 3600
  cold_pull_outcome_s: 1800
  token_env: DISCORD_BOT_TOKEN
  allowed_user_ids: ''
telegram:
  # Standalone bot only, when [bot] platform is telegram (#164). The token itself
  # never goes in a file here; token_env names the environment variable holding it.
  token_env: TELEGRAM_BOT_TOKEN
  # Chat (group) ID the bot posts to. Telegram group and channel IDs are negative.
  chat_id: ''
  # Telegram user IDs allowed to use the bot, separated by commas or spaces.
  # approval_user_id is always allowed. Empty with no approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # Largest file the bot uploads: the Telegram Bot API cloud limit.
  upload_max_bytes: 50000000
matrix:
  # Standalone bot only, when [bot] platform is matrix (#164). The access token
  # itself never goes in a file here; access_token_env names the environment
  # variable holding it. The room must be unencrypted: encrypted rooms are
  # not supported.
  homeserver_url: ''
  access_token_env: MATRIX_ACCESS_TOKEN
  # Room ID of the print room (starts with '!'), from the room's settings.
  room_id: ''
  # Matrix user IDs allowed to use the bot, full @user:server form, separated
  # by commas or spaces. approval_user_id is always allowed. Empty with no
  # approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # The bot's own Matrix user ID (@user:server). Empty: asked from the
  # homeserver (whoami) at startup.
  bot_user_id: ''
  # Largest file the bot uploads; the adapter lowers it to the homeserver's
  # media limit when the server reports a smaller one.
  upload_max_bytes: 50000000
bot:
  mode: hermes
  platform: discord
  health_port: 0
  health_stale_s: 120
  sync_commands: true
llm:
  chat_url: ''
  model: ''
  api_key_env: LLM_API_KEY
  timeout_s: 20
listener:
  tick_s: 600
  ifs_presence_poll_s: 15
  spool_nag_s: 600
  start_claim_ttl_s: 1800
vision:
  model: gemini-latest
  roast_model: luna-latest
  # The one-line roast on the print-started post only. On by
  # default: it runs whenever an LLM/vision endpoint is available
  # (services.vision_chat_url plus CLIPROXY_API_KEY), on every platform,
  # Telegram included. Set false to turn roasts off; camera checks keep
  # using the same endpoint either way.
  roast_enabled: true
visual_watch:
  # Camera watchdog sensitivity, 1 (quietest) to 5 (most alerts). 3 is the original behavior.
  # Periodic camera checks run every 1800, 1200, 900, 600 or 450 seconds for levels 1 to 5;
  # a stall alerts after 8, 5, 3, 3 or 2 unchanged layers, and at levels 1-2 a vision "ok"
  # cancels a stall alert. Spaghetti, detached, empty-bed, uncertain and failed checks alert
  # at every level. The full table is in docs/PROJECT-REFERENCE.md (Camera stall sensitivity).
  sensitivity: 3
  enabled: true
timelapse:
  # Mode (#246/#295): rendered = the printer renders it (moonraker-timelapse),
  # container = Print Buddy captures and encodes it in-container, off = none.
  # Empty derives: rendered when a Moonraker URL is configured, else off.
  mode: ''
  archive_host: ''
  archive_dir: ''
  ssh_key: ''
  render_wait_s: 900
  render_poll_s: 10
  max_bytes: 209715200
  local_retention_days: 1
  plan_clip_retention_days: 14
  # ffmpeg encoder for the timelapse sizing shrink (#314): cpu (libx264),
  # vaapi, qsv or nvenc. Hardware choices need the GPU passed through (see
  # docs/DOCKER.md); a failed hardware encode falls back to cpu.
  encoder: cpu
  # Vertical short (#317): also post a 9:16 version of each finished
  # timelapse, for Shorts/Reels/TikTok-style sharing. Off by default.
  vertical_short: false
  # pad = blurred background fill (default); crop = centre crop.
  vertical_short_mode: pad
  vertical_short_overlay: true
  # In-container timelapse capture (#246): off by default; existing behaviour
  # (printer-rendered timelapses only) is unchanged while this is false.
  # Turning it on starts the bundled go2rtc in the full Docker image, which
  # normalises the camera source on loopback for the capture stage.
  capture_enabled: false
  # Optional explicit camera source for capture (an MJPEG/RTSP URL or a
  # go2rtc ffmpeg: source). Empty derives the source from
  # services.camera_snapshot_url / the Moonraker webcam, as the camera
  # watchdog does.
  capture_source_url: ''
  # Stage 2 frame capture: what makes the listener take a frame.
  # interval = every capture_interval_s seconds (default; printer-agnostic);
  # layer = on Moonraker layer changes (moonraker-timelapse semantics);
  # both = either (an interval floor plus layer events).
  capture_trigger: interval
  capture_interval_s: 5.0
  # Per-job storage caps for captured frames; 0 disables that cap. Capture
  # stops at a cap and the frames already taken are kept for the encode.
  capture_max_frames: 3600
  capture_max_bytes: 536870912
  # Encoder preference for the Stage 3 encode (auto | vaapi | nvenc | qsv |
  # cpu). Capture itself never encodes; the value is recorded now so the
  # encode stage needs no settings change.
  capture_encoder: auto
logging:
  level: INFO
  format: text
  file: ''
webui:
  # Optional Web UI (#286): off by default; nothing listens while disabled.
  # Port 0 means no port has been chosen yet. The access token itself never
  # goes in a file here; access_token_env names the environment variable
  # holding it.
  enabled: false
  host: 127.0.0.1
  port: 0
  access_token_env: WEBUI_ACCESS_TOKEN
live_stream:
  # Live camera viewing in Discord (#311): off by default. The bot cannot
  # send video itself; /print-live starts a viewing session and points at
  # the Discord Activity launched in voice_channel_id. The Discord client
  # secret and the Activity session secret are environment secrets, never
  # settings here.
  enabled: false
  voice_channel_id: ''
  auto_start_on_print: false
  max_height: 720
  fps: 15
  max_bitrate_kbps: 2500
  encoder: auto
  empty_timeout_s: 300
  activity_origin: ''
maintenance:
  quick_hours: 25
  full_hours: 75
  full_days: 30
