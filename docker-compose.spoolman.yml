# Optional bundled Spoolman. Load it together with docker-compose.yml:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.spoolman.yml     # in .env
#   # or: docker compose -f docker-compose.yml -f docker-compose.spoolman.yml up -d
#
# Spoolman keeps its SQLite database in ${PRINT_BUDDY_DATA}/spoolman. Switching between this and an
# external Spoolman without losing spools: docs/DOCKER.md, "Spoolman".
services:
  print-buddy:
    environment:
      # Wins over the external URL in .env while this file is loaded.
      PRINT_BUDDY__SERVICES__SPOOLMAN_URL: http://spoolman:8000
    depends_on:
      spoolman:
        condition: service_healthy

  spoolman:
    image: ghcr.io/donkie/spoolman:${SPOOLMAN_TAG:-0.27.0}
    restart: unless-stopped
    ports:
      - "${SPOOLMAN_PORT:-7912}:8000"
    volumes:
      - ${PRINT_BUDDY_DATA:-./data}/spoolman:/home/app/.local/share/spoolman
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Spoolman starts as root only to switch to this uid/gid, which must own the data directory.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    # Spoolman's entrypoint needs these to remap its user and drop root; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
