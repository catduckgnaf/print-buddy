# Installation example. GHCR image: ghcr.io/catduckgnaf/print-buddy; published by the manual workflow after offline acceptance. Prefer its tested digest.
# Set PRINT_BUDDY_IMAGE to an approved locally built image or tested immutable digest.
# Spoolman is included in this stack (#214): it always runs alongside Print Buddy, with no
# separate opt-in Compose file. Setting PRINT_BUDDY__SERVICES__SPOOLMAN_URL in .env to an
# existing external Spoolman makes Print Buddy use that instance instead; the included
# container and its data are then simply unused, never migrated or overwritten.
x-runtime: &runtime
  image: ${PRINT_BUDDY_IMAGE:?Set PRINT_BUDDY_IMAGE to a tested image digest or local tag}
  restart: unless-stopped
  env_file: [.env]
  environment:
    # To use legacy TOML, select /app/config/docker.toml in .env.
    # Mount a custom config at the selected path with a local Compose override.
    PRINT_BUDDY_CONFIG: ${PRINT_BUDDY_CONFIG:-/app/config/docker.yaml}
    PRINT_BUDDY__BOT__MODE: standalone
    # Bundled OrcaSlicer channel the entrypoint selects at startup (docs/SETTINGS.md
    # "Runtime environment"); stable is the default, alpha is the other accepted value.
    PRINT_BUDDY_ORCA_CHANNEL: ${PRINT_BUDDY_ORCA_CHANNEL:-stable}
    # Included Spoolman by default. An empty or unset value in .env falls back to the
    # included service; a non-empty value is an existing external Spoolman and wins.
    PRINT_BUDDY__SERVICES__SPOOLMAN_URL: ${PRINT_BUDDY__SERVICES__SPOOLMAN_URL:-http://spoolman:8000}
  volumes:
    - ${PRINT_BUDDY_DATA:-./data}/hermes:/data/hermes
    - ${PRINT_BUDDY_DATA:-./data}/archive:/data/archive
    - ${PRINT_BUDDY_DATA:-./data}/records:/data/records
    - ${PRINT_BUDDY_DATA:-./data}/cache:/data/cache
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  shm_size: 256m
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  depends_on:
    spoolman:
      condition: service_healthy
services:
  bot:
    <<: *runtime
    command: [python3, -m, print_buddy.bot]
    healthcheck:
      test: [CMD, python3, -m, print_buddy.bot, health]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  listener:
    <<: *runtime
    command: [python3, -m, print_buddy.hermes.moonraker_event_listener]
    healthcheck:
      test: [CMD, python3, -m, print_buddy.healthcheck]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  spoolman:
    # Included Spoolman companion (#214), adapted from zaheria985 Docker commit 3bb0984 (MIT).
    # Pinned upstream release; never `latest`. See docs/DOCKER.md for the update policy.
    image: ghcr.io/donkie/spoolman:0.27.0
    restart: unless-stopped
    volumes:
      - ${PRINT_BUDDY_DATA:-./data}/spoolman:/home/app/.local/share/spoolman
    environment:
      TZ: ${TZ:-UTC}
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    # No host port: Print Buddy reaches Spoolman on the Compose network, and the
    # Spoolman UI/API is not exposed on the host by this stack.
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
