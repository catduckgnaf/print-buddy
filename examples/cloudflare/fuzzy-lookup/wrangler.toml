# Print Handy semantic lookup Worker (PRINT_FUZZY_URL). See README.md.
# No account_id here: `npx wrangler login` picks the account.
name = "print-handy-fuzzy-lookup"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Workers AI binding, read in the code as env.AI.
[ai]
binding = "AI"

# LOOKUP_SECRET is a secret, not a var: set it with
#   npx wrangler secret put LOOKUP_SECRET
