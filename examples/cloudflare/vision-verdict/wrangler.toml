# Print Handy camera verdict Worker (PRINT_VISION_URL). See README.md.
# No account_id here: `npx wrangler login` picks the account.
name = "print-handy-vision-verdict"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Workers AI binding, read in the code as env.AI.
[ai]
binding = "AI"

# VISION_SECRET is a secret, not a var: set it with
#   npx wrangler secret put VISION_SECRET
# Optional: use a different Workers AI vision model.
# [vars]
# VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
