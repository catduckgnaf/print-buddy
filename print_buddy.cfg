# print-buddy: report AD5X slots that match the loaded spool.
#
# ZMod already switches to another spool when the stored color and the
# stored material type match. See the AD5X guide, section 3:
# https://github.com/ghzserg/zmod/blob/main/docs/en/AD5X.md
#
# This file only reports that match. It does not change the loaded slot,
# call SET_EXTRUDER_SLOT, or feed filament. The Discord hook in
# plugins/print-feedback is not installed by this file and does not run here.
#
# Copy the variable values into mod_data/user.cfg. Use the same color and
# material names you stored with the COLOR menu. A 0 means "not set" and
# that slot is ignored.
#
# Every assignment below is at the top level of the template. Klipper runs
# this with variable marks of a single brace.

[gcode_macro _PRINT_BUDDY_VARS]
description: Slot color and material copied from the COLOR menu
variable_slot1_color: 0
variable_slot1_material: 0
variable_slot2_color: 0
variable_slot2_material: 0
variable_slot3_color: 0
variable_slot3_material: 0
variable_slot4_color: 0
variable_slot4_material: 0
gcode:

[gcode_macro PRINT_BUDDY]
description: List other IFS slots with the same color and material as one slot
gcode:
    {% set color1 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot1_color|string %}
    {% set material1 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot1_material|string %}
    {% set color2 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot2_color|string %}
    {% set material2 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot2_material|string %}
    {% set color3 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot3_color|string %}
    {% set material3 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot3_material|string %}
    {% set color4 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot4_color|string %}
    {% set material4 = printer["gcode_macro _PRINT_BUDDY_VARS"].slot4_material|string %}
    {% set active = params.SLOT|default(0)|int %}
    {% set use_params = params.COLOR is defined and params.MATERIAL is defined %}
    {% set use_slot = active >= 1 and active <= 4 %}
    {% set want_color = (params.COLOR|string) if use_params else (color1 if active == 1 else color2 if active == 2 else color3 if active == 3 else color4 if active == 4 else '0') %}
    {% set want_material = (params.MATERIAL|string) if use_params else (material1 if active == 1 else material2 if active == 2 else material3 if active == 3 else material4 if active == 4 else '0') %}
    {% set missing = want_color|length == 0 or want_color == '0' or want_material|length == 0 or want_material == '0' %}
    {% set hit1 = (not use_slot or active != 1) and color1|lower == want_color|lower and material1|lower == want_material|lower and color1 != '0' and material1 != '0' %}
    {% set hit2 = (not use_slot or active != 2) and color2|lower == want_color|lower and material2|lower == want_material|lower and color2 != '0' and material2 != '0' %}
    {% set hit3 = (not use_slot or active != 3) and color3|lower == want_color|lower and material3|lower == want_material|lower and color3 != '0' and material3 != '0' %}
    {% set hit4 = (not use_slot or active != 4) and color4|lower == want_color|lower and material4|lower == want_material|lower and color4 != '0' and material4 != '0' %}
    {% set found = (['1'] if hit1 else []) + (['2'] if hit2 else []) + (['3'] if hit3 else []) + (['4'] if hit4 else []) %}
    {% if missing %}
        {action_respond_info("PRINT_BUDDY: no color and material. Pass SLOT, or COLOR and MATERIAL.")}
    {% else %}
        {action_respond_info("PRINT_BUDDY: no other slot matches %s / %s."|format(want_color, want_material) if found|length == 0 else "PRINT_BUDDY: %s / %s also on slot %s. ZMod can switch. This macro does not."|format(want_color, want_material, found|join(",")))}
    {% endif %}
