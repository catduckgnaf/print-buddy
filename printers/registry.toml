# Root-level printer registry. See printers/README.md for the schema.
#
# This is the discoverable data index of the printers Print Handy knows about. The
# executable profiles stay in print_handy/printers/<vendor>/<printer>.py (one MODEL
# per file); every entry here must match a registered model, and tests check the
# key, firmware, connection, bed, height and color_system against the model's own
# defaults so this file cannot silently drift from the code.
#
# firmware_family is the lookup family used by firmware/commands.toml:
# zmod, klipper or marlin. Printers whose firmware has no command registry yet
# use "none".

[[printer]]
key = "flashforge.ad5x"
label = "Flashforge AD5X (ZMod)"
vendor = "flashforge"
firmware = "ZMod Klipper"
firmware_family = "zmod"
connection = "moonraker"
kinematics = "CoreXY"
bed_mm = [220.0, 220.0]
max_height_mm = 220.0
filament_slots = 4
color_system = "multi_slot"
profile = "print_handy/printers/flashforge/ad5x.py"
notes = "Physical sheet is 235 mm; the usable print area is 220 mm. IFS with 4 slots and a native screen that owns Z offset and mesh in native mode."

[[printer]]
key = "flashforge.ad5m"
label = "Flashforge AD5M (ZMod)"
vendor = "flashforge"
firmware = "ZMod Klipper"
firmware_family = "zmod"
connection = "moonraker"
kinematics = "CoreXY"
bed_mm = [220.0, 220.0]
max_height_mm = 220.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/flashforge/ad5m.py"
notes = "Single extruder, no IFS. Same 220 mm cube as the AD5X without the filament system; the PRINT_HANDY spool-match macro is AD5X-only."

[[printer]]
key = "flashforge.ad5m_pro"
label = "Flashforge AD5M Pro (ZMod)"
vendor = "flashforge"
