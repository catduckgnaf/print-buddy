# Printer registry: klipper. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "klipper." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/klipper/ so this file cannot silently drift from the code.

[[printer]]
key = "klipper.generic"
label = "Generic Klipper"
vendor = "klipper"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "unspecified"
bed_mm = [220.0, 220.0]
max_height_mm = 220.0
filament_slots = 1
profile = "print_handy/printers/klipper/generic.py"
notes = "Placeholder dimensions for a stock Klipper printer; override bed and height in local config for a real machine."
