# Printer registry: prusa. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "prusa." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/prusa/ so this file cannot silently drift from the code.

[[printer]]
key = "prusa.mk4s"
label = "Prusa MK4S"
vendor = "prusa"
firmware = "Prusa Buddy (PrusaLink)"
firmware_family = "prusa"
connection = "prusalink"
kinematics = "Cartesian (moving bed)"
bed_mm = [250.0, 210.0]
max_height_mm = 220.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/prusa/mk4s.py"
notes = "PrusaLink LAN (status, verified upload, gated start) when configured; otherwise slicing/checks/Discord delivery only. Not tested on hardware."

[[printer]]
key = "prusa.coreone"
label = "Prusa CORE One"
vendor = "prusa"
firmware = "Prusa Buddy (PrusaLink)"
firmware_family = "prusa"
connection = "prusalink"
kinematics = "CoreXY"
bed_mm = [250.0, 220.0]
max_height_mm = 270.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/prusa/coreone.py"
notes = "Enclosed CoreXY on PrusaLink. Chamber is not driven. Not tested on hardware."

[[printer]]
key = "prusa.xl"
label = "Prusa XL (5-tool)"
vendor = "prusa"
firmware = "Prusa Buddy (PrusaLink)"
firmware_family = "prusa"
connection = "prusalink"
kinematics = "CoreXY"
bed_mm = [360.0, 360.0]
max_height_mm = 360.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/prusa/xl.py"
notes = "Five toolheads; Print Handy slices single-tool (tool 0) jobs only. PrusaLink as the other Prusa models."

[[printer]]
key = "prusa.miniplus"
label = "Prusa MINI+"
vendor = "prusa"
firmware = "Prusa Buddy (PrusaLink)"
firmware_family = "prusa"
connection = "prusalink"
kinematics = "Cartesian (moving bed)"
bed_mm = [180.0, 180.0]
max_height_mm = 180.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/prusa/miniplus.py"
notes = "Runs Orca MINI profiles (printer_model Prusa MINI). PrusaLink as the other Prusa models."
