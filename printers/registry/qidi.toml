# Printer registry: qidi. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "qidi." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/qidi/ so this file cannot silently drift from the code.

[[printer]]
key = "qidi.q1pro"
label = "Qidi Q1 Pro"
vendor = "qidi"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "CoreXY"
bed_mm = [245.0, 245.0]
max_height_mm = 240.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/qidi/q1pro.py"
notes = "Stock Klipper + Moonraker. Enclosed CoreXY with an actively heated chamber (set by the template start code, not driven separately). The pinned Orca profile records a bed exclusion polygon along the back edge; not tested on hardware."

