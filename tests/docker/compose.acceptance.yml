# Acceptance-only overlay for tests/docker/image_acceptance.sh. Never used for a deployment.
# The combined container and the fake printer sit on an internal network with no route out,
# use dummy secrets from the harness's .env, and never restart, so a failure surfaces instead
# of looping. The fake Moonraker is the only "printer" and has a readiness check, so
# `up --wait` waits for it. The bundled Spoolman API stays on the container's loopback.
networks:
  isolated:
    internal: true

services:
  combined:
    networks: [isolated]
    restart: "no"
    environment:
      PRINT_HANDY__SERVICES__MOONRAKER_URL: http://fake-moonraker:7125
    depends_on:
      fake-moonraker:
        condition: service_healthy
    healthcheck:
      # Matches the combined image's own start period: the supervisor starts Spoolman
      # first and the listener's first heartbeat lands only after Spoolman is ready,
      # so a 10s start period marks the container unhealthy before it can be healthy.
      interval: 5s
      start_period: 90s
      retries: 3

  fake-moonraker:
    # Served by the image under test's own Python and websockets: no extra image is pulled.
    image: ${PRINT_HANDY_IMAGE:?Set PRINT_HANDY_IMAGE}
    entrypoint: [python3, /fixture/fake_moonraker.py, "7125"]
    volumes:
      - ${ACCEPTANCE_FIXTURES:?Set ACCEPTANCE_FIXTURES}:/fixture:ro
    networks: [isolated]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7125/server/info', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
