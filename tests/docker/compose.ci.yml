# CI-only overlay: points Print Buddy at a fake Moonraker on its own container, as an external
# endpoint, and checks health more often. Used by tests/docker/compose_smoke.sh.
services:
  print-buddy:
    environment:
      PRINT_BUDDY__SERVICES__MOONRAKER_URL: http://fake-moonraker:7125
    depends_on:
      fake-moonraker:
        condition: service_started
    healthcheck:
      interval: 5s
      start_period: 10s

  fake-moonraker:
    # The release image's Python and websockets serve the fake; no extra image is pulled.
    image: ${PRINT_BUDDY_IMAGE:-ghcr.io/catduckgnaf/print-buddy}:${PRINT_BUDDY_TAG:-stable}
    entrypoint: ["python3", "/fake/fake_moonraker.py", "7125"]
    volumes:
      - ./tests/docker:/fake:ro
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
